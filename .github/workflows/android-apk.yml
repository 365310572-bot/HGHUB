name: Build HGhub Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358" "build-tools;35.0.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android
        run: pnpm exec tauri android init --ci

      - name: Build Android APK
        run: pnpm exec tauri android build --apk --target aarch64

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android/app/build/outputs/apk \
            -type f -name "*.apk" -exec cp {} artifacts/ \;
          test -n "$(find artifacts -name '*.apk' -print -quit)"

     
      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          KS="$RUNNER_TEMP/hghub-release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BT/apksigner"

          for f in artifacts/*.apk; do
            "$APKSIGNER" sign \
              --ks "$KS" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              "$f"
            "$APKSIGNER" verify "$f"
          done

          rm -f "$KS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-Android-ARM64-signed
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7